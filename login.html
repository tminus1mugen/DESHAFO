<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Login | DESHAFO Integrated CBO</title>
  <meta name="description" content="Sign in to your DESHAFO Integrated CBO member account." />
  <meta name="robots" content="noindex, follow" />
  <meta name="author" content="DESHAFO Integrated CBO" />
  <meta name="theme-color" content="#0f6a3c" />
  <link rel="canonical" href="https://deshafo.org/login.html" />
  <link rel="apple-touch-icon" href="assets/images/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    .pw-wrap { position:relative; }
    .pw-wrap input { padding-right:48px; }
    .pw-toggle { position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text-light); }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .auth-card {
        padding: 32px 24px !important;
        max-width: 100% !important;
      }
    }
  </style>
  <link rel="stylesheet" href="css/loader.css"/>
</head>
<body>
<!-- ═══════════════ LOGO LOADER ═══════════════ -->
<div id="page-loader" aria-label="Loading" role="status">
  <div class="ldr-orb ldr-orb--a"></div>
  <div class="ldr-orb ldr-orb--b"></div>
  <div class="ldr-orb ldr-orb--c"></div>
  <div class="ldr-stage">
    <div class="ldr-ripple ldr-ripple--1"></div>
    <div class="ldr-ripple ldr-ripple--2"></div>
    <div class="ldr-ripple ldr-ripple--3"></div>
    <div class="ldr-outer-ring"></div>
    <svg class="ldr-orbital" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="90" class="ldr-track"/>
      <circle cx="100" cy="100" r="90" class="ldr-comet--glow"/>
      <circle cx="100" cy="100" r="90" class="ldr-comet--arc"/>
      <circle cx="100" cy="100" r="90" class="ldr-comet--tip"/>
    </svg>
    <div class="ldr-logo-wrap">
      <img src="assets/images/logo.png" class="ldr-logo" alt="DESHAFO"/>
      <div class="ldr-logo-halo"></div>
      <div class="ldr-logo-shine"></div>
    </div>
  </div>
  <p class="ldr-tagline"><em>Shaping Destiny.</em>&nbsp; Restoring Hope.</p>
  <div class="ldr-dots"><span></span><span></span><span></span><span></span><span></span></div>
</div>
<!-- ══════════════ END LOADER ══════════════ -->

<!-- Minimal nav -->
<div class="navbar-wrapper">
  <nav class="navbar">
    <div class="nav-left"><a href="index.html">← Back to Home</a></div>
    <div class="nav-logo"><a href="index.html"><img src="assets/images/logo.png" alt="DESHAFO" /></a></div>
    <div class="nav-right"><a href="signup.html">Create Account</a></div>
    <div class="hamburger"><span></span><span></span><span></span></div>
  </nav>
</div>

<div class="auth-page">
  <div class="auth-card">
    <img src="assets/images/logo.png" alt="DESHAFO" class="auth-logo" />
    <h2>Welcome Back</h2>
    <p class="auth-sub">Sign in to your DESHAFO account</p>

    <form>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" placeholder="Your password" required />
          <button type="button" class="pw-toggle"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <label style="display:flex;align-items:center;gap:8px;font-size:0.88rem;cursor:pointer;color:var(--text-muted);">
          <input type="checkbox" style="width:auto;accent-color:var(--green);" /> Remember me
        </label>
        <a href="#" style="color:var(--green);font-size:0.88rem;font-weight:600;">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Sign In</button>
    </form>

    <div class="auth-divider"><span>or</span></div>
    <p class="auth-switch">Don't have an account? <a href="signup.html">Create one free →</a></p>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  (function(){
    var l=document.getElementById('page-loader');
    if(!l)return;

    /* Skip loader on all visits after the first in this session */
    if(sessionStorage.getItem('visited')){l.style.transition='none';l.style.display='none';return;}
    sessionStorage.setItem('visited','1');

    var FAST_MS=280;   /* pages loading faster than this skip the loader entirely */
    var MIN_MS =700;   /* minimum time loader is shown on slow pages              */
    var t0=window.performance&&performance.timing?performance.timing.navigationStart:Date.now();

    window.addEventListener('load',function(){
      var elapsed=Date.now()-t0;
      if(elapsed<FAST_MS){
        /* Fast load — kill loader with no visible flash */
        l.style.transition='none';
        l.style.display='none';
      } else {
        /* Slow load — keep visible for minimum time, then fade */
        var wait=Math.max(0,MIN_MS-elapsed);
        setTimeout(function(){ l.classList.add('loader-hidden'); },wait);
      }
    });

    /* Browser back/forward (bfcache restore) — page is already ready */
    window.addEventListener('pageshow',function(e){
      if(e.persisted){ l.style.transition='none'; l.style.display='none'; }
    });
  })();
</script></body>
</html>
